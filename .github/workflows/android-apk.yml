# Đóng gói Nông Trại Nhỏ thành APK Android (Capacitor) mỗi khi game trên nhánh main thay đổi.
# APK nằm ở mục Releases của repo (bản mới nhất) và trong Artifacts của lần chạy.
name: Đóng APK Android

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - index.html
      - manifest.webmanifest
      - icon-512.png
      - tools/android/**
      - .github/workflows/android-apk.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Kiểm tra Android SDK có sẵn trên máy GitHub
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Tạo dự án Capacitor
        run: |
          mkdir -p build/www build/assets
          cp index.html manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png build/www/
          cp tools/android/icon-1024.png build/assets/icon-only.png
          cd build
          npm init -y > /dev/null
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3
          npx cap init "Nông Trại Nhỏ" com.vtagames.nongtrainho --web-dir www
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#7cc455' --iconBackgroundColorDark '#2b1d14'
          node ../tools/android/patch-android.js ${{ github.run_number }}
          npx cap sync android

      - name: Đóng APK
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/NongTraiNho-VTAGames-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: NongTraiNho-apk
          path: NongTraiNho-VTAGames-*.apk

      - name: Đưa APK lên Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Nông Trại Nhỏ 1.0.${{ github.run_number }}
          body: |
            Bản APK Android của Nông Trại Nhỏ (VTA Games · Võ Thái Anh).
            Tải file .apk bên dưới về điện thoại, mở lên và cho phép cài ứng dụng từ nguồn này.
          files: NongTraiNho-VTAGames-*.apk
          make_latest: true
